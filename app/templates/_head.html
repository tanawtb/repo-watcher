<script>
// One-time migration: older builds saved the theme in localStorage.
(function () {
  if (!/(?:^|;\s*)rw-theme=/.test(document.cookie)) {
    var saved = localStorage.getItem('rw-theme');
    if (saved === 'light' || saved === 'dark') {
      document.cookie = 'rw-theme=' + saved + '; path=/; max-age=31536000; SameSite=Lax';
      document.documentElement.dataset.theme = saved;
      localStorage.removeItem('rw-theme');
    }
  }
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* design tokens — light default, dark via data-theme (always set server-side) */
  :root {
    --bg: #f3f5f9; --glow1: rgba(59,130,246,.18); --glow2: rgba(168,85,247,.12);
    --card: rgba(255,255,255,.65); --card-line: rgba(15,23,42,.08); --shadow: 0 8px 30px rgba(15,23,42,.06);
    --fg: #0f172a; --mute: #5b6678; --hover: rgba(15,23,42,.045);
    --field: rgba(255,255,255,.7); --field-line: rgba(15,23,42,.12);
    --primary: #5b5ff0; --primary-fg: #fff;
    --crit: #dc2626; --high: #c2410c; --med: #a16207; --low: #0369a1;
    --good: #15803d; --star: #d97706;
    --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #0b0f17; --glow1: rgba(59,130,246,.14); --glow2: rgba(168,85,247,.10);
    --card: rgba(255,255,255,.06); --card-line: rgba(255,255,255,.10); --shadow: none;
    --fg: #e5e7eb; --mute: #8b96a8; --hover: rgba(255,255,255,.055);
    --field: rgba(255,255,255,.06); --field-line: rgba(255,255,255,.12);
    --primary: #7c83ff; --primary-fg: #0b0f17;
    --crit: #fb4d5c; --high: #fb923c; --med: #eab308; --low: #38bdf8;
    --good: #4ade80; --star: #fbbf24;
    color-scheme: dark;
  }
  body {
    min-height: 100vh; color: var(--fg);
    background:
      radial-gradient(1200px 700px at 80% -10%, var(--glow1), transparent 60%),
      radial-gradient(900px 600px at -10% 30%, var(--glow2), transparent 55%),
      var(--bg);
    background-color: var(--bg);
  }
  .display { font-family: var(--display); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .glass-card {
    background: var(--card); border: 1px solid var(--card-line); border-radius: 1.25rem;
    backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: var(--shadow);
  }
  /* interactive glass buttons: seamless hover lift */
  a.glass-card, button.glass-card {
    transition: background .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  a.glass-card:hover, button.glass-card:hover {
    background: color-mix(in srgb, var(--card) 72%, var(--fg) 9%);
    border-color: color-mix(in srgb, var(--card-line) 55%, var(--fg) 22%);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(0,0,0,.14);
  }
  @media (prefers-reduced-motion: reduce) { a.glass-card, button.glass-card { transition: none; } a.glass-card:hover, button.glass-card:hover { transform: none; } }
  .sm { font-size: 14px; color: var(--mute); }
  .o { opacity: .45; }
  /* repo names link to that repo's dependency report */
  .rlink { color: inherit; text-decoration: none; }
  .rlink:hover { text-decoration: underline; text-decoration-color: var(--primary); text-underline-offset: 2px; }

  /* tiles */
  .tile b { display: block; font: 700 30px/1.2 var(--mono); color: var(--c, var(--fg)); }
  .tile span { font-size: 12px; color: var(--mute); }

  /* summary tab */
  .sumgrid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,2fr); gap: 16px; align-items: start; }
  .subcard { border: 1px solid var(--card-line); border-radius: 16px; padding: 18px 20px; }
  .subcard h2 { margin: 0 0 14px; font: 600 16px var(--display); }
  .delta { display: flex; gap: 28px; }
  .delta .d { display: grid; }
  .delta .d b { font: 500 30px/1.3 var(--mono); }
  .delta .d span { font-size: 12px; color: var(--mute); }
  .delta .dim { opacity: .6; }
  table.per { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.per th { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--mute); text-align: right; padding: 0 0 8px; }
  table.per th:first-child { text-align: left; }
  table.per td { padding: 6px 0; border-bottom: 1px solid var(--card-line); }
  table.per tr:last-child td { border: 0; }
  td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .zero { opacity: .35; }
  .c-crit { color: var(--crit); } .c-high { color: var(--high); }
  td.n.unk { color: var(--mute); opacity: .7; }
  .unknote { font: 12px var(--mono); color: var(--high); background: color-mix(in srgb, var(--high) 10%, transparent); border: 1px solid color-mix(in srgb, var(--high) 30%, transparent); border-radius: 10px; padding: 7px 10px; margin-bottom: 12px; }

  /* heat grid */
  .heatwrap { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--card-line); }
  .heathead { display: flex; justify-content: space-between; align-items: baseline; font: 500 12px var(--display); color: var(--mute); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  .heat { display: flex; flex-wrap: wrap; gap: 5px; max-height: 196px; overflow-y: auto; padding: 2px; }
  .cell { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) calc(var(--i) * 100%), transparent); color: var(--fg); font: 500 11px var(--mono); display: inline-flex; align-items: center; justify-content: center; padding: 0; transition: transform .12s; cursor: pointer; }
  .cell:hover, .cell:focus-visible { transform: scale(1.15); }
  .cell[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: 1px; }
  .cell.clear { --c: var(--mute); background: none; border-style: dashed; opacity: .5; color: var(--mute); cursor: default; }
  .cell.unknown { --c: var(--mute); background: repeating-linear-gradient(135deg, transparent 0 3px, color-mix(in srgb, var(--mute) 22%, transparent) 3px 5px); border-style: dotted; color: var(--mute); cursor: default; }
  .heatcap { min-height: 20px; margin-top: 10px; }
  .heatkey { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font: 11px var(--mono); color: var(--mute); }
  .heatkey span:before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: var(--c); margin-right: 5px; vertical-align: -1px; }
  .heatkey .clr:before { background: none; border: 1px dashed var(--mute); width: 7px; height: 7px; }
  .heatkey .unk:before { background: none; border: 1px dotted var(--mute); width: 7px; height: 7px; }
  @media (prefers-reduced-motion: reduce) { .cell { transition: none; } }

  /* tabs */
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--hover); width: max-content; max-width: 100%; overflow-x: auto; margin-bottom: 16px; }
  .tab { border: 0; background: none; border-radius: 10px; padding: 7px 16px; font: 500 14px var(--display); color: var(--mute); white-space: nowrap; display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { background: var(--card); color: var(--fg); box-shadow: 0 0 0 1px var(--card-line); }
  .tab .k { font: 11px var(--mono); padding: 0 7px; border-radius: 999px; background: var(--hover); color: var(--mute); }
  .tabpanel[hidden] { display: none; }

  /* alert list */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
  .field { background: var(--field); border: 1px solid var(--field-line); border-radius: 12px; color: inherit; padding: 7px 13px; font: inherit; font-size: 13.6px; }
  #q { flex: 1 1 224px; min-width: 0; }
  .fav[aria-pressed="true"] { border-color: var(--star); color: var(--star); }
  .chipf { display: inline-flex; gap: 8px; align-items: center; border-color: var(--primary); color: var(--primary); cursor: pointer; }
  .repo-head { display: flex; align-items: baseline; gap: 10px; padding: 15px 4px 6px; }
  .repo-head:first-child { padding-top: 4px; }
  .rn { font-weight: 600; }
  .branch { font: 11px var(--mono); padding: 2px 7px; border-radius: 8px; border: 1px solid var(--card-line); opacity: .75; }
  .cnt { margin-left: auto; font: 12px var(--mono); opacity: .5; }
  .star { background: none; border: 0; padding: 2px 4px; font-size: 16px; line-height: 1; color: var(--mute); opacity: .7; align-self: center; cursor: pointer; }
  .star:hover, .star[aria-pressed="true"] { color: var(--star); opacity: 1; }
  .row { display: grid; grid-template-columns: 3px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 7px 12px 7px 9px; margin-left: 18px; border-radius: 12px; text-decoration: none; color: inherit; }
  .row:hover { background: var(--hover); }
  .row[hidden] { display: none; }
  .rail { align-self: stretch; border-radius: 3px; background: var(--c); }
  .pkg { font-weight: 500; font-size: 14px; }
  .desc { font-size: 12px; opacity: .55; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { text-align: right; white-space: nowrap; }
  .ver { font: 12px var(--mono); } .ver .fix { opacity: .55; }
  .tags { font-size: 11px; opacity: .6; margin-top: 2px; } .tags u { text-decoration: none; color: var(--c); }
  .none { padding: 20px 0; opacity: .6; text-align: center; }

  /* pagination */
  .pager { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--card-line); }
  .pager:empty { display: none; }
  .pinfo { font-size: 13px; color: var(--mute); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pinfo b { color: var(--fg); font-weight: 500; font-family: var(--mono); }
  .psize { padding: 4px 10px; font-size: 13px; border-radius: 999px; }
  .pages { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: var(--hover); }
  .pg { min-width: 34px; height: 34px; padding: 0 10px; border: 0; border-radius: 999px; background: none; font: 500 13px var(--mono); color: var(--mute); display: inline-flex; align-items: center; justify-content: center; transition: background .15s, color .15s; cursor: pointer; }
  .pg:hover:not(:disabled):not([aria-current="page"]) { background: var(--card); color: var(--fg); }
  .pg[aria-current="page"] { background: var(--primary); color: var(--primary-fg); font-weight: 600; }
  .pg:disabled { opacity: .35; cursor: default; }
  .pg.arrow { font-size: 15px; }
  .gap { min-width: 22px; text-align: center; color: var(--mute); font: 13px var(--mono); }
  @media (prefers-reduced-motion: reduce) { .pg { transition: none; } }
  @media (max-width: 560px) { .pager { justify-content: center; } }

  /* sweep history */
  table.hist { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.hist td { padding: 10px 0; border-bottom: 1px solid var(--card-line); }
  table.hist tr:last-child td { border: 0; }
  .hist .bar { height: 6px; border-radius: 3px; background: var(--hover); overflow: hidden; min-width: 80px; }
  .hist .bar i { display: block; height: 100%; background: var(--primary); opacity: .6; border-radius: 3px; }
  .hist tr:first-child .bar i { opacity: 1; }
  .ok { color: var(--good); } .fail { color: var(--high); }

  /* watched repos */
  .whead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  .w { display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 10px; }
  .w:hover { background: var(--hover); }
  .w .nm { font-family: var(--display); }
  .w .note { font-size: 13px; opacity: .5; }
  .w .ac { margin-left: auto; display: flex; gap: 4px; }
  .ib { background: none; border: 0; border-radius: 8px; padding: 3px 8px; font-size: 14px; color: var(--mute); cursor: pointer; }
  .ib:hover { background: var(--hover); color: var(--fg); }
  .ib.del:hover { color: var(--crit); }

  @media (max-width: 760px) {
    .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .tiles .tile:first-child { grid-column: 1 / -1; }
    .sumgrid { grid-template-columns: minmax(0,1fr); }
  }
  @media (max-width: 560px) {
    .row { grid-template-columns: 3px minmax(0,1fr); margin-left: 0; }
    .meta { grid-column: 2; text-align: left; }
  }
</style>
